services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: "4000"
      CORS_ORIGIN: ${CORS_ORIGIN}
    expose:
      - "4000"
